<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a1a">
<title>Anon Chat</title>
<style>
:root {
  --bg:#0a0a1a; --header:#0d0d22; --border:#1e1e3a;
  --bubble-a:#1e1040; --bubble-b:#0a2a0a;
  --text:#e0e0ff; --sub:#888; --title:#c0b0ff;
  --send:#3a1a7e; --input-bg:#0d0d22;
}
.theme-rose { --bg:#1a0a12; --header:#220d18; --border:#3a1a28;
  --bubble-a:#2a0a1a; --bubble-b:#1a0a22;
  --text:#ffe0ee; --sub:#886; --title:#ffb0cc;
  --send:#7a1a3a; --input-bg:#1a0a18; }
.theme-ocean { --bg:#0a1520; --header:#0d1f2d; --border:#1a3040;
  --bubble-a:#0a2035; --bubble-b:#0a2a1a;
  --text:#d0eeff; --sub:#578; --title:#80ccff;
  --send:#0a4a7a; --input-bg:#0d1828; }
.theme-forest { --bg:#0a150a; --header:#0d1f0d; --border:#1a301a;
  --bubble-a:#102010; --bubble-b:#0a1a20;
  --text:#d0ffd0; --sub:#686; --title:#90ee90;
  --send:#1a4a1a; --input-bg:#0d180d; }

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;height:100dvh;display:flex;flex-direction:column;max-width:600px;margin:0 auto;overflow:hidden;}

/* LOCK SCREEN */
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:20px;padding:32px;}
.lock-title{font-size:28px;letter-spacing:6px;color:var(--title);font-weight:200;}
.lock-version{font-size:11px;letter-spacing:2px;color:#333355;}
.lock-input{background:var(--input-bg);border:1px solid var(--border);border-radius:14px;color:var(--text);padding:12px 20px;font-size:16px;width:100%;max-width:280px;text-align:center;outline:none;font-family:inherit;}
.lock-btn{background:linear-gradient(135deg,var(--send),#7a4abe);border:none;color:#fff;border-radius:14px;padding:12px 40px;font-size:15px;cursor:pointer;font-family:inherit;}
#role-screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:24px;padding:32px;}
.role-btn{background:var(--input-bg);border:2px solid var(--border);border-radius:20px;color:var(--text);padding:20px 48px;font-size:18px;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.role-btn:active{transform:scale(0.95);}

/* CHAT */
#chat-screen{display:none;flex-direction:column;height:100dvh;}
.header{background:var(--header);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.header-back{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:6px 12px;cursor:pointer;font-size:15px;font-family:inherit;}
.header-info{flex:1;text-align:center;}
.header-name{font-size:15px;color:var(--title);font-weight:500;}
.header-presence{font-size:11px;margin-top:3px;}
.header-sos{background:linear-gradient(135deg,#cc0000,#ff3333);border:none;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit;}

/* MESSAGES */
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;}
#msgs::-webkit-scrollbar{width:3px;}
#msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

.msg-wrap{display:flex;flex-direction:column;max-width:78%;}
.msg-wrap.me{align-self:flex-end;align-items:flex-end;}
.msg-wrap.them{align-self:flex-start;align-items:flex-start;}
.bubble{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;position:relative;cursor:pointer;}
.me .bubble{background:var(--bubble-a);border-bottom-right-radius:4px;}
.them .bubble{background:var(--bubble-b);border-bottom-left-radius:4px;}
.msg-time{font-size:10px;color:var(--sub);margin-top:2px;padding:0 4px;}
.msg-status{font-size:10px;color:var(--sub);}
.reply-preview{background:rgba(255,255,255,0.06);border-left:3px solid var(--title);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--sub);margin-bottom:4px;max-width:100%;}
.reactions{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;}
.reaction-pill{background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:20px;padding:2px 7px;font-size:12px;cursor:pointer;}
.img-msg{max-width:220px;border-radius:12px;cursor:pointer;}
.system-msg{text-align:center;font-size:11px;color:var(--sub);padding:4px 0;}

/* REPLY BAR */
#reply-bar{display:none;background:var(--header);border-top:1px solid var(--border);padding:8px 14px;font-size:12px;color:var(--sub);flex-direction:row;align-items:center;gap:8px;}
#reply-bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* INPUT */
.input-area{background:var(--input-bg);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;}
.plus-btn{background:var(--input-bg);border:1px solid var(--border);border-radius:50%;color:var(--sub);width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
#msg-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:14px;color:var(--text);padding:9px 14px;font-size:14px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.4;}
.send-btn{background:linear-gradient(135deg,var(--send),#7a4abe);border:none;color:#fff;border-radius:50%;width:38px;height:38px;flex-shrink:0;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.send-btn:disabled{opacity:0.4;}

/* CONTEXT MENU */
#ctx-menu{position:fixed;z-index:500;background:var(--header);border:1px solid var(--border);border-radius:14px;padding:6px 0;box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;min-width:160px;}
.ctx-item{padding:10px 16px;font-size:13px;cursor:pointer;color:var(--text);}
.ctx-item:active{background:rgba(255,255,255,0.05);}
.ctx-item.red{color:#ff6666;}
.emoji-row{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);}
.e-btn{font-size:20px;cursor:pointer;padding:2px;}

/* EMOJI PICKER */
#emoji-picker{display:none;position:fixed;bottom:70px;left:12px;z-index:400;background:var(--header);border:1px solid var(--border);border-radius:16px;padding:12px;width:280px;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.emoji-grid span{font-size:22px;cursor:pointer;text-align:center;padding:3px;}

/* SETTINGS PANEL */
#settings-panel{display:none;position:fixed;inset:0;z-index:600;background:var(--bg);overflow-y:auto;padding:20px 16px;}
.settings-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.settings-title{font-size:18px;color:var(--title);font-weight:500;}
.settings-section{background:var(--header);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.settings-label{font-size:11px;color:var(--title);font-weight:600;letter-spacing:1px;margin-bottom:10px;}
.settings-input{background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 12px;font-size:14px;font-family:inherit;outline:none;width:100%;}
.settings-btn{background:linear-gradient(135deg,var(--send),#7a4abe);border:none;color:#fff;border-radius:10px;padding:8px 20px;cursor:pointer;font-size:13px;font-family:inherit;}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.theme-option{border:2px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;text-align:center;font-size:13px;}
.theme-option.active{border-color:var(--title);}

/* EMERGENCY */
#emerg-modal{display:none;position:fixed;inset:0;z-index:700;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;}
#emerg-modal.open{display:flex;}
.emerg-box{background:#110008;border:2px solid #cc0033;border-radius:20px;padding:28px 24px;max-width:300px;width:90%;text-align:center;}
.emerg-box h3{color:#ff4466;font-size:20px;margin-bottom:8px;}
.emerg-box p{color:#cc8899;font-size:13px;margin-bottom:20px;line-height:1.6;}
.emerg-confirm{background:linear-gradient(135deg,#cc0000,#ff2244);border:none;color:#fff;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:8px;}
.emerg-cancel{background:transparent;border:1px solid #333;color:#666;border-radius:12px;padding:10px;font-size:14px;cursor:pointer;font-family:inherit;width:100%;}
#emerg-banner{position:fixed;top:0;left:0;right:0;z-index:800;background:linear-gradient(135deg,#cc0000,#990000);padding:14px 16px;display:none;align-items:center;gap:10px;max-width:600px;margin:0 auto;}
#emerg-banner.show{display:flex;animation:slideDown 0.3s ease;}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.emerg-dismiss{background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;}

/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(30,30,60,0.95);color:#c0b0ff;border:1px solid var(--border);border-radius:12px;padding:8px 18px;font-size:13px;z-index:900;display:none;white-space:nowrap;}

/* TYPING */
#typing{text-align:left;font-size:11px;color:var(--sub);padding:0 14px 4px;display:none;}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-title">ANON CHAT</div>
  <div class="lock-version">v 1.3.9</div>
  <input class="lock-input" type="password" id="pwd-input" placeholder="Secret code..." onkeydown="if(event.key==='Enter')unlock()">
  <button class="lock-btn" onclick="unlock()">Enter</button>
</div>

<!-- ROLE SCREEN -->
<div id="role-screen">
  <div style="font-size:14px;color:var(--sub);letter-spacing:2px;">তুমি কে?</div>
  <button class="role-btn" onclick="selectRole('A')">★ Star</button>
  <button class="role-btn" onclick="selectRole('B')">☽ Moon</button>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <!-- HEADER -->
  <div class="header">
    <button class="header-back" onclick="goBack()">←</button>
    <div class="header-info">
      <div class="header-name" id="hdr-name">—</div>
      <div class="header-presence" id="hdr-presence"></div>
    </div>
    <button class="header-back" onclick="openSettings()" style="font-size:18px;letter-spacing:1px;">⋮</button>
  </div>

  <!-- MESSAGES -->
  <div id="msgs"></div>
  <div id="typing"></div>

  <!-- REPLY BAR -->
  <div id="reply-bar">
    <span id="reply-text">↩ reply</span>
    <button onclick="clearReply()" style="background:none;border:none;color:var(--sub);cursor:pointer;font-size:16px;">✕</button>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="uploadPhoto(event)">
    <button class="plus-btn" onclick="document.getElementById('photo-input').click()">📷</button>
    <textarea id="msg-input" rows="1" placeholder="কিছু লেখো..."></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMsg()" disabled>➤</button>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="emoji-row" id="ctx-emojis"></div>
  <div class="ctx-item" onclick="ctxReply()">↩ Reply</div>
  <div class="ctx-item" onclick="ctxCopy()">📋 Copy</div>
  <div class="ctx-item red" onclick="ctxDelete()">🗑 Delete</div>
</div>

<!-- EMOJI PICKER -->
<div id="emoji-picker">
  <div class="emoji-grid" id="emoji-grid"></div>
</div>

<!-- SETTINGS -->
<div id="settings-panel">
  <div class="settings-header">
    <button onclick="closeSettings()" style="background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;">←</button>
    <div class="settings-title">Settings</div>
  </div>

  <!-- Nickname -->
  <div class="settings-section">
    <div class="settings-label">✏️ NICKNAME</div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:6px;">আমার নাম</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input class="settings-input" id="my-nick" placeholder="নাম লিখো..." maxlength="20">
      <button class="settings-btn" onclick="saveMyNick()">Save</button>
    </div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:6px;">অপরজনের নাম</div>
    <div style="display:flex;gap:8px;">
      <input class="settings-input" id="other-nick" placeholder="নাম লিখো..." maxlength="20">
      <button class="settings-btn" onclick="saveOtherNick()">Save</button>
    </div>
  </div>

  <!-- Theme -->
  <div class="settings-section">
    <div class="settings-label">🎨 THEME</div>
    <div class="theme-grid">
      <div class="theme-option" id="t-dark" onclick="setTheme('dark')">🌑 Dark</div>
      <div class="theme-option" id="t-rose" onclick="setTheme('rose')">🌸 Rose</div>
      <div class="theme-option" id="t-ocean" onclick="setTheme('ocean')">🌊 Ocean</div>
      <div class="theme-option" id="t-forest" onclick="setTheme('forest')">🌿 Forest</div>
    </div>
  </div>

  <!-- Banned Words -->
  <div class="settings-section">
    <div class="settings-label">🚫 BANNED WORDS</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input class="settings-input" id="bword-input" placeholder="Word লিখো...">
      <button class="settings-btn" onclick="addBannedWord()">Add</button>
    </div>
    <div id="bword-list" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
  </div>

  <!-- Emergency ntfy -->
  <div class="settings-section">
    <div class="settings-label">🆘 EMERGENCY (ntfy)</div>
    <div style="font-size:11px;color:var(--sub);margin-bottom:6px;">তোমার ntfy topic</div>
    <div style="display:flex;gap:8px;">
      <input class="settings-input" id="my-topic" placeholder="anonchat_star">
      <button class="settings-btn" onclick="saveTopics()">Save</button>
    </div>
  </div>
</div>

<!-- EMERGENCY MODAL -->
<div id="emerg-modal">
  <div class="emerg-box">
    <h3>🚨 Emergency!</h3>
    <p>অপর জনকে ntfy-তে notification পাঠানো হবে।</p>
    <button class="emerg-confirm" onclick="sendEmergency()">📲 পাঠাও</button>
    <button class="emerg-cancel" onclick="document.getElementById('emerg-modal').classList.remove('open')">বাতিল</button>
  </div>
</div>

<!-- EMERGENCY BANNER -->
<div id="emerg-banner">
  <div style="font-size:24px;">🚨</div>
  <div style="flex:1;color:#fff;font-size:14px;font-weight:600;" id="emerg-banner-text">Emergency Call!</div>
  <button class="emerg-dismiss" onclick="dismissEmerg()">OK</button>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove, set, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMTgqiX7AQQ5wyqMAb6oBl5cYaDXLYwQA",
  authDomain: "anon-chat-e6476.firebaseapp.com",
  databaseURL: "https://anon-chat-e6476-default-rtdb.firebaseio.com",
  projectId: "anon-chat-e6476",
  storageBucket: "anon-chat-e6476.firebasestorage.app",
  messagingSenderId: "416773751234",
  appId: "1:416773751234:web:fb29f0f7a4c49c45d7565b"
};
const SECRET = "moonstar2025";
const ICONS = { A:"★", B:"☽" };
const EMOJIS = ['🤍','🙂','😑','😆','😮','😢','👍','🥀','🪦','❤️','😂','🔥','💀','🫶','✨'];
const CLOUDINARY_CLOUD = "djado1b65";
const CLOUDINARY_PRESET = "voiceee";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const msgsRef   = ref(db, "messages");
const presRef   = ref(db, "presence");
const nickRef   = ref(db, "nicknames");
const themeDbRef= ref(db, "theme");
const bwordRef  = ref(db, "bannedWords");
const emergRef  = ref(db, "emergency");
const topicRef  = ref(db, "ntfyTopics");

let myRole=null, nicknames={A:"Star",B:"Moon"}, theme="dark";
let allMsgs=[], replyTo=null, ctxMsg=null, bannedWords=[];
let ntfyTopics={A:"anonchat_star",B:"anonchat_moon"};
let presData={}, emergDismissTs=0;
let unsubMsgs,unsubPres,unsubNick,unsubTheme,unsubBword,unsubEmerg,unsubTopic;
let presInterval;

// ── LOCK ──
window.unlock = function() {
  const v = document.getElementById('pwd-input').value.trim();
  if (v !== SECRET) { alert('Wrong code!'); return; }
  document.getElementById('lock').style.display = 'none';
  document.getElementById('role-screen').style.display = 'flex';
};
document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.unlock();
});

// ── ROLE SELECT ──
window.selectRole = function(role) {
  myRole = role;
  document.getElementById('role-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  initChat();
};

// ── INIT CHAT ──
function initChat() {
  setupEmoji();
  startPresence();
  subscribeNicknames();
  subscribeTheme();
  subscribeBannedWords();
  subscribeMessages();
  subscribeEmergency();
  subscribeTopics();
  updateHeader();
}

// ── PRESENCE ──
function startPresence() {
  function ping(typing=false) {
    set(ref(db, `presence/${myRole}`), { last: Date.now(), typing });
  }
  ping();
  presInterval = setInterval(ping, 8000);
  document.getElementById('msg-input').addEventListener('input', () => {
    ping(true);
    clearTimeout(window._typingTimeout);
    window._typingTimeout = setTimeout(() => ping(false), 3000);
  });
  unsubPres = onValue(presRef, snap => {
    presData = snap.val() || {};
    updateHeader();
  });
}

function updateHeader() {
  const other = myRole==='A' ? 'B' : 'A';
  const otherName = nicknames[other] || (other==='A'?'Star':'Moon');
  document.getElementById('hdr-name').textContent = ICONS[other] + ' ' + otherName;
  const p = presData[other];
  const el = document.getElementById('hdr-presence');
  const typing = document.getElementById('typing');
  if (!p || !p.last) { el.innerHTML=''; typing.style.display='none'; return; }
  if (p.typing && Date.now()-p.last<5000) {
    typing.style.display='block';
    typing.textContent = otherName + ' লিখছে...';
  } else { typing.style.display='none'; }
  const diff = Date.now() - Number(p.last);
  let txt, dot;
  if (diff<10000) { txt='Online'; dot='#22ee66'; }
  else {
    const s=Math.floor(diff/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    if(h>0) txt=`Last Active ${h}h ${m}m ago`;
    else if(m>0) txt=`Last Active ${m}m ${sec}s ago`;
    else txt=`Last Active ${sec}s ago`;
    dot = diff<60000?'#ffaa22':diff<3600000?'#ff6644':'#555';
  }
  el.innerHTML = `<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,0.3);border-radius:20px;padding:2px 10px;font-size:10px;color:#bbb;"><span style="width:6px;height:6px;border-radius:50%;background:${dot};${diff<10000?'box-shadow:0 0 5px '+dot:''}display:inline-block;"></span>${txt}</span>`;
}

// ── NICKNAMES ──
function subscribeNicknames() {
  unsubNick = onValue(nickRef, snap => {
    const d = snap.val()||{};
    nicknames.A = d.A||'Star'; nicknames.B = d.B||'Moon';
    updateHeader();
    renderAllMsgs();
    // Populate settings inputs
    const other = myRole==='A'?'B':'A';
    document.getElementById('my-nick').placeholder = nicknames[myRole];
    document.getElementById('other-nick').placeholder = nicknames[other];
  });
}
window.saveMyNick = async function() {
  const v = document.getElementById('my-nick').value.trim();
  if (!v) return;
  await update(nickRef, {[myRole]: v});
  document.getElementById('my-nick').value='';
  toast('✅ Nickname updated!');
};
window.saveOtherNick = async function() {
  const other = myRole==='A'?'B':'A';
  const v = document.getElementById('other-nick').value.trim();
  if (!v) return;
  await update(nickRef, {[other]: v});
  document.getElementById('other-nick').value='';
  toast('✅ Nickname updated!');
};

// ── THEME ──
function subscribeTheme() {
  unsubTheme = onValue(themeDbRef, snap => {
    const t = snap.val() || 'dark';
    applyTheme(t);
  });
}
window.setTheme = async function(t) {
  await set(themeDbRef, t);
};
function applyTheme(t) {
  theme = t;
  document.body.className = t==='dark' ? '' : `theme-${t}`;
  document.querySelectorAll('.theme-option').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`t-${t}`);
  if (el) el.classList.add('active');
}

// ── BANNED WORDS ──
function subscribeBannedWords() {
  unsubBword = onValue(bwordRef, snap => {
    bannedWords = Object.values(snap.val()||{});
    renderBwordList();
  });
}
function renderBwordList() {
  const el = document.getElementById('bword-list');
  el.innerHTML = bannedWords.map((w,i) =>
    `<span style="background:rgba(255,50,50,0.15);border:1px solid #aa3333;border-radius:20px;padding:3px 10px;font-size:12px;color:#ff8888;cursor:pointer;" onclick="removeBword(${i})">🚫 ${w} ✕</span>`
  ).join('');
}
window.addBannedWord = async function() {
  const inp = document.getElementById('bword-input');
  const v = inp.value.trim().toLowerCase();
  if (!v || bannedWords.includes(v)) return;
  bannedWords.push(v);
  await set(bwordRef, Object.fromEntries(bannedWords.map((w,i)=>[i,w])));
  inp.value='';
};
window.removeBword = async function(i) {
  bannedWords.splice(i,1);
  await set(bwordRef, Object.fromEntries(bannedWords.map((w,j)=>[j,w])));
};
function hasBannedWord(txt) {
  const lower = txt.toLowerCase();
  return bannedWords.some(w => lower.includes(w));
}

// ── MESSAGES ──
function subscribeMessages() {
  unsubMsgs = onValue(msgsRef, snap => {
    allMsgs = [];
    snap.forEach(c => allMsgs.push({id:c.key,...c.val()}));
    renderAllMsgs();
    markSeen();
  });
}

function renderAllMsgs() {
  const el = document.getElementById('msgs');
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  el.innerHTML = allMsgs.map(renderMsg).join('');
  // attach events
  el.querySelectorAll('.bubble').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); });
    b.addEventListener('contextmenu', e => { e.preventDefault(); showCtx(b.dataset.id, e.clientX, e.clientY); });
    b.addEventListener('touchstart', handleTouchStart, {passive:true});
    b.addEventListener('touchend', handleTouchEnd);
    b.addEventListener('touchmove', () => clearTimeout(window._longPress), {passive:true});
  });
  el.querySelectorAll('.e-react').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); addReaction(b.dataset.id, b.dataset.emoji); });
  });
  el.querySelectorAll('.img-msg').forEach(img => {
    img.addEventListener('click', () => window.open(img.src,'_blank'));
  });
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function renderMsg(m) {
  if (m.system) return `<div class="system-msg">${m.text}</div>`;
  const isMe = m.role === myRole;
  const cls = isMe ? 'me' : 'them';
  const name = nicknames[m.role] || (m.role==='A'?'Star':'Moon');
  const time = m.ts ? new Date(m.ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
  const status = isMe ? (m.seen ? '<span style="color:#80ccff">Seen</span>' : m.delivered ? 'Delivered' : '') : '';

  let replyHtml = '';
  if (m.replyTo) {
    const orig = allMsgs.find(x=>x.id===m.replyTo);
    if (orig) replyHtml = `<div class="reply-preview">↩ ${orig.text||'📷 Photo'}</div>`;
  }

  let bodyHtml = '';
  if (m.img) bodyHtml = `<img class="img-msg" src="${m.img}" loading="lazy">`;
  else bodyHtml = escHtml(m.text||'');

  let reactions = '';
  if (m.reactions) {
    const grouped = {};
    Object.values(m.reactions).forEach(e => { grouped[e]=(grouped[e]||0)+1; });
    reactions = `<div class="reactions">${Object.entries(grouped).map(([e,c])=>`<span class="reaction-pill e-react" data-id="${m.id}" data-emoji="${e}">${e}${c>1?c:''}</span>`).join('')}</div>`;
  }

  return `<div class="msg-wrap ${cls}">
    ${replyHtml}
    <div class="bubble" data-id="${m.id}">${bodyHtml}</div>
    ${reactions}
    <div class="msg-time">${time} ${status}</div>
  </div>`;
}

function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

// ── SEND ──
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
  document.getElementById('send-btn').disabled = !this.value.trim();
});
document.getElementById('msg-input').addEventListener('keydown', function(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

window.sendMsg = async function() {
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if (!txt) return;
  if (hasBannedWord(txt)) { toast('🚫 Banned word!'); return; }
  const msg = { role:myRole, text:txt, ts:Date.now(), delivered:true };
  if (replyTo) { msg.replyTo=replyTo.id; }
  clearReply();
  inp.value=''; inp.style.height='auto';
  document.getElementById('send-btn').disabled=true;
  await push(msgsRef, msg);
};

async function uploadPhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  toast('📤 Uploading...');
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {method:'POST',body:fd});
    const data = await res.json();
    await push(msgsRef, { role:myRole, img:data.secure_url, ts:Date.now(), delivered:true });
    toast('✅ Photo sent!');
  } catch(e) { toast('❌ Upload failed'); }
  event.target.value='';
}
window.uploadPhoto = uploadPhoto;

function markSeen() {
  const other = myRole==='A'?'B':'A';
  allMsgs.filter(m=>m.role===other&&!m.seen).forEach(m=>{
    update(ref(db,`messages/${m.id}`),{seen:true});
  });
}

// ── REPLY ──
window.clearReply = function() {
  replyTo=null;
  document.getElementById('reply-bar').style.display='none';
};

// ── CONTEXT MENU ──
let longPressTimer;
function handleTouchStart(e) {
  const id = this.dataset.id;
  longPressTimer = setTimeout(()=>showCtx(id,e.touches[0].clientX,e.touches[0].clientY),500);
}
function handleTouchEnd() { clearTimeout(longPressTimer); }

function showCtx(id, x, y) {
  ctxMsg = allMsgs.find(m=>m.id===id);
  if (!ctxMsg) return;
  const menu = document.getElementById('ctx-menu');
  // emoji row
  document.getElementById('ctx-emojis').innerHTML = EMOJIS.slice(0,9).map(e=>
    `<span class="e-btn e-react" data-id="${id}" data-emoji="${e}">${e}</span>`
  ).join('');
  menu.querySelectorAll('.e-react').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();addReaction(id,b.dataset.emoji);hideCtx();});
  });
  // position
  const vw=window.innerWidth, vh=window.innerHeight;
  menu.style.display='block';
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  menu.style.left = Math.min(x, vw-mw-8)+'px';
  menu.style.top  = Math.min(y, vh-mh-8)+'px';
}
function hideCtx() { document.getElementById('ctx-menu').style.display='none'; ctxMsg=null; }
document.addEventListener('click', hideCtx);

window.ctxReply = function() {
  if (!ctxMsg) return;
  replyTo = ctxMsg;
  document.getElementById('reply-text').textContent = '↩ ' + (ctxMsg.text||'📷 Photo');
  document.getElementById('reply-bar').style.display='flex';
  document.getElementById('msg-input').focus();
  hideCtx();
};
window.ctxCopy = function() {
  if (!ctxMsg||!ctxMsg.text) return;
  navigator.clipboard.writeText(ctxMsg.text).then(()=>toast('📋 Copied!'));
  hideCtx();
};
window.ctxDelete = async function() {
  if (!ctxMsg||ctxMsg.role!==myRole) { toast('❌ Cannot delete'); hideCtx(); return; }
  await remove(ref(db,`messages/${ctxMsg.id}`));
  hideCtx();
};

async function addReaction(id, emoji) {
  await update(ref(db,`messages/${id}/reactions`),{[myRole]:emoji});
}

// ── EMOJI PICKER ──
function setupEmoji() {
  const grid = document.getElementById('emoji-grid');
  const allEmoji = ['😀','😂','🥹','😍','🥰','😘','😎','🤩','😏','😒','😢','😭','😤','😡','🤬','🥺','😳','🤯','😱','😴','🤔','🫠','😶','🙃','🫡','🤗','🤭','🫢','🤫','🤥','😬','🙄','😈','💀','👻','🤡','🫶','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🔥','✨','⭐','🌙','🌸','🌹','🥀','🌺','🍀','🎵','🎶','💌','💣','🎯','🏆','👑','💎','🪐','🌈','⚡','🌊','🍓','🍒','🎂','🍕','☕','🧋','🎁','🎉','🪄','🫧','💫','🌟'];
  grid.innerHTML = allEmoji.map(e=>`<span onclick="insertEmoji('${e}')">${e}</span>`).join('');
}
window.insertEmoji = function(e) {
  const inp = document.getElementById('msg-input');
  inp.value += e;
  inp.dispatchEvent(new Event('input'));
  document.getElementById('emoji-picker').style.display='none';
};

// ── SETTINGS ──
window.openSettings = function() {
  document.getElementById('settings-panel').style.display='block';
  const other=myRole==='A'?'B':'A';
  document.getElementById('my-nick').placeholder=nicknames[myRole];
  document.getElementById('other-nick').placeholder=nicknames[other];
  document.getElementById('my-topic').value=ntfyTopics[myRole]||'';
};
window.closeSettings = function() {
  document.getElementById('settings-panel').style.display='none';
};

// ── EMERGENCY ──
function subscribeTopics() {
  unsubTopic = onValue(topicRef, snap => {
    ntfyTopics = { A:'anonchat_star', B:'anonchat_moon', ...(snap.val()||{}) };
    document.getElementById('my-topic').value = ntfyTopics[myRole]||'';
  });
}
window.saveTopics = async function() {
  const v = document.getElementById('my-topic').value.trim();
  if (!v) return;
  ntfyTopics[myRole] = v;
  await update(topicRef, {[myRole]:v});
  toast('✅ Topic saved!');
};

function subscribeEmergency() {
  unsubEmerg = onValue(emergRef, snap => {
    const d = snap.val();
    if (!d) return;
    if (d.target!==myRole) return;
    if ((d.ts||0) <= emergDismissTs) return;
    if (Date.now()-(d.ts||0)>30000) return;
    showEmergBanner(d.senderName||'অপর জন');
  });
}
function showEmergBanner(name) {
  const b = document.getElementById('emerg-banner');
  document.getElementById('emerg-banner-text').textContent = `🚨 An urgent call from ${name}!`;
  b.classList.add('show');
  if ('vibrate' in navigator) navigator.vibrate([300,100,300,100,600]);
  setTimeout(()=>b.classList.remove('show'),15000);
}
window.dismissEmerg = function() {
  emergDismissTs = Date.now();
  document.getElementById('emerg-banner').classList.remove('show');
};
window.openEmergModal = function() {
  document.getElementById('emerg-modal').classList.add('open');
};

window.sendEmergency = async function() {
  document.getElementById('emerg-modal').classList.remove('open');
  if (!myRole) return;
  const otherRole = myRole==='A'?'B':'A';
  const myName = nicknames[myRole]||(myRole==='A'?'Star':'Moon');
  const otherTopic = ntfyTopics[otherRole]||`anonchat_${otherRole==='A'?'star':'moon'}`;

  await set(emergRef, { target:otherRole, sender:myRole, senderName:myName, ts:Date.now() });

  try {
    const res = await fetch(`https://ntfy.sh/${otherTopic}`, {
      method:'POST',
      headers:{ 'Title':'Emergency SOS', 'Priority':'urgent', 'Tags':'rotating_light' },
      body:'An urgent call! Come to chat now!'
    });
    if (res.ok) toast('✅ Emergency sent!');
    else toast('❌ ntfy error: '+res.status);
  } catch(e) { toast('❌ Error: '+e.message); }

  if ('vibrate' in navigator) navigator.vibrate([100,50,100]);
};

// ── GO BACK ──
window.goBack = function() {
  if (unsubMsgs) unsubMsgs();
  if (unsubPres) unsubPres();
  if (unsubNick) unsubNick();
  if (unsubTheme) unsubTheme();
  if (unsubBword) unsubBword();
  if (unsubEmerg) unsubEmerg();
  if (unsubTopic) unsubTopic();
  clearInterval(presInterval);
  set(ref(db,`presence/${myRole}`), null);
  myRole=null; allMsgs=[]; replyTo=null;
  document.getElementById('chat-screen').style.display='none';
  document.getElementById('role-screen').style.display='flex';
};

// ── TOAST ──
function toast(msg, dur=2500) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  clearTimeout(window._toast);
  window._toast=setTimeout(()=>el.style.display='none',dur);
}
window.toast=toast;

// ── PRESENCE HEADER UPDATE INTERVAL ──
setInterval(()=>{ if(myRole) updateHeader(); }, 5000);

// ── HEADER SOS BUTTON → add to header dynamically ──
document.querySelector('.header-back:last-child').insertAdjacentHTML('beforebegin',
  '<button class="header-sos" onclick="openEmergModal()">🆘</button>'
);
</script>
</body>
</html>
